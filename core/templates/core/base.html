{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="COEUS — A safe space for mental health support for young Nigerians." />
  <title>{% block title %}COEUS{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}" />
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% if messages %}
    <div class="site-messages-container" style="max-width:960px;margin:1rem auto 0;padding:0 1.25rem;">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}" style="margin-bottom:0.75rem;">
          {{ message }}
        </div>
      {% endfor %}
    </div>
  {% endif %}
  {% block body %}{% endblock %}
  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
